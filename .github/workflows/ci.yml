name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # wrangler.toml and .dev.vars are gitignored (per-developer config).
      # `wrangler types` reads both to generate the full Env interface — the
      # secret-backed vars (CLOUDFLARE_API_TOKEN etc.) only show up in Env if
      # a .dev.vars with those keys exists. Placeholder values are enough;
      # no real account/credentials needed for typecheck.
      - run: cp wrangler.toml.example wrangler.toml
      - run: cp .dev.vars.example .dev.vars
      - run: npm run types
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
