name = "ai-gateway-demo-worker"
main = "src/index.ts"
compatibility_date = "2024-06-20"
account_id = "1ddebf6f9507d3fc9052158be9d42dee"

[vars]
GATEWAY_NAME = "ai-cost-demo"

# KV namespace for storing custom costs and demo settings
[[kv_namespaces]]
